<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policies</title>
<style>
  :root { --bg: #F6F7FB; --card: #FFFFFF; --text: #151A2B; --muted: #4D5670; --accent: #0089A3; --line: #E2E6F0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0A0E1A; --card: #131A2E; --text: #E8ECF6; --muted: #A8B1C8; --accent: #00E5FF; --line: #232C47; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 30px; margin: 0 0 20px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; color: var(--accent); font-weight: 600; text-decoration: none; }
  a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Privacy Policies</h1>
  <ul>
    <li><a href="clash-snake/">Clash Snake</a></li>
  </ul>
</main>
</body>
</html>
